<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Signal lost · Ganesh Kumar P</title>
<meta name="robots" content="noindex" />

<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,800&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" />
<style>
  :root { --ink:#0C0D0B; --line:#2A2B2E; --washi:#ECE6D8; --muted:#A7A398; --shu:#F0553A; --phosphor:#8BE3B5; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--ink); color: var(--washi); font: 400 15px/1.6 "IBM Plex Mono", ui-monospace, monospace; }
  main { width: min(640px, 100%); border: 1px solid var(--line); padding: clamp(24px, 6vw, 48px); }
  .ep { color: var(--muted); letter-spacing: .12em; font-size: 13px; margin: 0; }
  h1 { font: 800 clamp(3.5rem, 14vw, 7rem)/.9 "Archivo", "Arial Narrow", sans-serif; font-stretch: 66%; text-transform: uppercase; margin: 16px 0 20px; }
  h1::after { content: ""; display: block; width: 160px; height: 1px; margin-top: 18px; background: var(--shu); }
  p { margin: 0 0 8px; }
  .muted { color: var(--muted); }
  .ps { color: var(--phosphor); }
  a { display: inline-flex; align-items: center; min-height: 48px; margin-top: 24px; padding: 0 22px; background: var(--washi); color: var(--ink); text-decoration: none; font-weight: 500; letter-spacing: .06em; text-transform: uppercase; font-size: 14px; }
  a:hover { background: var(--shu); }
  a:focus-visible { outline: 2px solid var(--shu); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <p class="ep">ERR 404 · CHANNEL NOT FOUND</p>
  <h1>Signal lost</h1>
  <p><span class="ps">gkp@chennai:~$</span> goto <span class="muted">this-page</span></p>

  <a href="/">Back to EP.00</a>
</main>
</body>
</html>
